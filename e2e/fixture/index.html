<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Fixture App</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; padding: 32px; }
    .hero { padding: 24px; border-radius: 12px; background: #f1f5f9; }
    .hero-title { margin: 0 0 8px; font-size: 28px; }
    nav a { margin-right: 12px; }
  </style>
</head>
<body>
  <nav><a href="/" id="home-link">Home</a><a href="/about" id="about-link">About</a></nav>
  <section class="hero">
    <h1 class="hero-title">Hello fixture</h1>
    <p class="hero-sub">A tiny app to drive the e2e suite.</p>
  </section>
  <form onsubmit="return false">
    <input id="name" placeholder="Your name" />
    <input id="pw" type="password" value="secret" />
    <select id="color"><option>Red</option><option>Blue</option></select>
    <button id="save" type="button" onclick="document.getElementById('out').textContent = 'saved ' + document.getElementById('name').value">Save</button>
  </form>
  <p id="out"></p>
  <script>
    document.getElementById('about-link').addEventListener('click', function (e) {
      e.preventDefault()
      history.pushState({}, '', '/about')
      document.getElementById('out').textContent = 'about page'
    })
    // Minimal "HMR": reload when the served file changes.
    let v = null
    setInterval(async function () {
      try {
        const r = await fetch('/__version')
        const nv = await r.text()
        if (v && nv !== v) location.reload()
        v = nv
      } catch (e) {}
    }, 250)
  </script>
</body>
</html>
